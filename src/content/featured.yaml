# Recent activity, on the Projects page.
#
# Hand-picked posts and links, listed under "Recent activity" above the
# repositories on /projects (the list only appears once there is an entry
# here). Edit this file to change what's featured — no code involved.
#
# To feature a LinkedIn post: open the post on LinkedIn, copy the number
# out of its URL (the digits after `urn:li:activity:` or after
# `-activity-`), and put it in `activityId`.
#
# - id: my-post
#   type: linkedin
#   title: What the post is about
#   summary: One line under the title.
#   activityId: '0000000000000000000'
#   url: https://www.linkedin.com/feed/update/urn:li:activity:0000000000000000000/
#   order: 1
