# The roadmap: the robots ESRA is building, or has committed to build.
#
# Shown on the home page and at the top of /projects.
#
#   status      active | planned | complete
#   flagship    true for the one program that gets the wide card
#   milestones  feed the schedule on the home page and the "on the
#               horizon" list on /events. `starts` only places the "now"
#               marker — readers see `when`, so keep that to what the
#               roadmap actually commits to (a month or a season).
#
# Only state what is decided. A program with no dates yet simply has no
# `timeframe` and no `milestones`. Where a date is still between two
# candidates, `when` says the season and `starts` takes the later date, so
# the "now" marker never runs ahead of what has happened.

- id: h1
  order: 1
  title: H1 humanoid
  designation: H1
  kind: Humanoid
  level: Flagship
  flagship: true
  status: active
  # TODO(confirm): H1 completes in May/June or in July 2027. "mid-2027" covers both.
  timeframe: Oct 2026 – mid-2027
  summary: A full-scale humanoid, built across campuses.
  description: >-
    H1 brings mechanical structures, actuators, electronics, sensing and
    control software together in one robot, designed, built and tested by
    teams at different universities.
  focus:
    - Mechanical
    - Actuation
    - Electronics
    - Embedded software
    - Controls
    - Perception
    - Simulation
  outputs:
    - Technical papers and reports
    - Engineering videos
    - Progress reports
    - Open-source code and build guides
  milestones:
    - starts: 2026-10-15
      when: Oct–Nov 2026
      title: Launch and baseline
      body: Teams split the work and agree on a shared technical baseline.
    - starts: 2026-11-11
      when: Winter 2026–27
      title: Subsystem development
      # TODO(confirm): the online winter workshop is in December 2026 or on Jan 3–10, 2027.
      body: Each team builds and tests its subsystem at home. Online winter workshop.
    # TODO(confirm): February or April 2027. "Early 2027" covers both.
    - starts: 2027-04-01
      when: Early 2027
      title: First integration session
      body: 'Two weeks in person: assemble the full robot, tune it, test it, collect data.'
    # TODO(confirm): May or July 2027. "Mid-2027" covers both.
    - starts: 2027-07-01
      when: Mid-2027
      title: H1 complete
      body: Final integration session, demonstrations, and the open release.

- id: q1
  order: 2
  title: Q1 quadruped
  designation: Q1
  kind: Quadruped
  level: Legged
  status: planned
  timeframe: From Feb 2027
  summary: >-
    A four-legged robot that builds on ESRA’s Q0 prototype, developed by a
    separate group of universities.

- id: teleoperation-arm
  order: 3
  title: Teleoperation arm
  kind: Manipulator
  level: Beginner
  status: planned
  timeframe: Feb – Apr 2027
  summary: >-
    A robot arm driven by a human operator: the starting project for new
    members, guided by senior members.

- id: precision-manipulation
  order: 4
  title: Precision manipulator
  kind: Manipulator
  level: Advanced
  status: planned
  timeframe: From May 2027
  summary: A high-payload arm that keeps high precision. Open to partners.
