# The ways to get involved.
#
# Each entry is one card in the "Get involved" section of the home page,
# and the pop-up that opens when the card is clicked.
#
#   icon       student | club | lab | company
#   points     the three lines on the card itself
#   intro      the opening paragraph of the pop-up
#   sections   headed blocks in the pop-up. Each has a `heading` and
#              exactly one body:
#                items  a list
#                table  `columns`, then `rows` of `cells` (one per
#                       column), and an optional `note` under the table
#                text   a short paragraph
#   notes      up to two highlighted asides after the sections
#              ("Good to know", "Coming soon")
#   start      how to take the first step (optional)
#   cta        button label; `subject` is the subject of the email it starts
#   email      the inbox the button writes to (default: info@esra.bot)
#   secondary  an optional second button: label, email, subject
#
# Keep this to what ESRA actually offers. Nothing here should promise a
# benefit, a deadline or a process that has not been decided.

- id: students
  order: 1
  icon: student
  audience: Students
  title: Join the team
  lede: Help build the robots, or the organisation behind them.
  points:
    - Own a real part of a working robot
    - Work with students from other universities
    - Leave with work you can show in interviews
  intro: >-
    ESRA is run by students. Engineers and programmers build the robots.
    Business and marketing students build the partnerships, funding and
    stories that keep the projects going.
  sections:
    - heading: Where you could work
      table:
        columns: [Track, Areas, Email]
        rows:
          - cells:
              - Engineering
              - Mechanical design and CAD, actuators, electronics and power, fabrication and testing, system integration
              - engineering@esra.bot
          - cells:
              - Computer science
              - Robotics and embedded software, controls, perception, simulation, data and test tools
              - engineering@esra.bot
          - cells:
              - Business and marketing
              - Partnerships, marketing and communications, finance, events and operations, strategy and growth
              # TODO(confirm): marketing@ must exist in Zoho. If it doesn't yet, use info@esra.bot.
              - marketing@esra.bot
    - heading: What you get
      items:
        - Responsibility for a real subsystem, software component, campaign or proposal
        - Design reviews and problem-solving with students from other schools
        - CAD, code, test results, proposals or campaigns to show employers
  start: Email us and tell us which part of ESRA you want to own.
  cta: Email engineering@esra.bot
  subject: Join the team
  email: engineering@esra.bot
  # TODO(confirm): marketing@ must exist in Zoho. If it doesn't yet, use info@esra.bot.
  secondary:
    label: Email marketing@esra.bot
    email: marketing@esra.bot
    subject: Join the team

- id: partner-club
  order: 2
  icon: club
  audience: University clubs
  title: Partner club
  lede: Build part of a robot no single campus could build alone.
  points:
    - Own a subsystem on a shared robot
    - Build and test at your own university
    - Share designs, code and events across the network
  intro: >-
    Partner clubs build. Teams agree on what the robot should do, split the
    engineering, and agree how the parts fit together. Then each club owns
    its part.
  sections:
    # TODO(confirm): an affiliate tier is left out until it is confirmed. If it
    # still exists, add a third row for it here.
    - heading: Ways to take part
      table:
        columns: [Role, Fits]
        rows:
          - cells: [Lead a subsystem, 'A club that can own a whole part, like the legs or a hand']
          - cells: [Contribute to a project, A club helping on a project without leading a part]
    - heading: What your club gets
      # TODO(confirm): add "A vote on the Leadership Council" once the bylaws are adopted.
      items:
        - Events, workshops and design reviews across the network
        - Shared designs, code and documentation
        - A starter kit for hosting ESRA events
        - Spotlights on the ESRA site and socials
        - Introductions to sponsors and mentors
    - heading: What we ask
      items:
        - A rep and a backup who reply within 7 days
        - One ESRA activity a semester
        - One hosted or co-hosted event a year
  notes:
    - label: Good to know
      body: >-
        Your club signs, not your university. It’s a good-faith agreement, not
        a contract, and you can leave with 30 days’ notice. You keep your
        name, members, robot and designs.
  start: Email us your club, your school, and what your team builds.
  cta: Join as a club
  subject: Partner club
  # TODO(confirm): partnerships@ must exist in Zoho. If it doesn't yet, use info@esra.bot.
  email: partnerships@esra.bot

- id: partner-lab
  order: 3
  icon: lab
  audience: Research labs
  title: Partner lab
  lede: Mentor student teams and meet motivated students.
  points:
    - Review designs and advise on research
    - Speak, teach or judge at ESRA events
    - Share tools, data and research openings
  intro: >-
    Labs bring research experience to student teams. Students stay
    responsible for the engineering; labs help them frame problems, test
    well and learn from current research.
  sections:
    - heading: What your lab could do
      items:
        - Review designs and test plans
        - Advise on papers and research questions
        - Give talks, lead workshops, judge challenges
        - Share open-source tools, datasets or test time
        - Post undergraduate research openings
    - heading: What we ask
      table:
        columns: [Commitment, Amount]
        rows:
          - cells: [Mentor a project team, '1 team, about 4 hours a month']
          - cells: [Speak or exhibit at ESRA events, 2 a year]
    - heading: What your lab gets
      items:
        - ESRA handles event logistics
        - A named student lead for each team you mentor
        - Introductions to industry partners
        - Your papers and news shared on ESRA channels
        - Letters of collaboration for grant proposals
  notes:
    - label: Good to know
      body: >-
        Labs advise and don’t build. Your research, equipment and members stay
        entirely yours.
  start: Email us your lab and research areas.
  cta: Become a partner lab
  subject: Partner lab
  # TODO(confirm): partnerships@ must exist in Zoho. If it doesn't yet, use info@esra.bot.
  email: partnerships@esra.bot

- id: industry-partner
  order: 4
  icon: company
  audience: Companies
  title: Industry partner
  lede: Put your platform in student hands across many campuses.
  points:
    - Fund a project or supply what you make
    - One contribution reaches many universities
    - Recognition on the robots you support
  intro: >-
    Companies give ESRA’s projects the resources to build real systems. In
    return, your product is used, tested and documented by students who
    carry it into labs, startups and industry.
  sections:
    - heading: Why sponsor
      items:
        - Students learn on your platform and take it with them
        - One contribution reaches teams at many universities
        - Projects produce documentation other teams reuse
    - heading: Two ways to give
      table:
        columns: [Route, What it is]
        rows:
          - cells: [Direct funding, Cash for one project or for shared resources]
          - cells:
              - Project package
              - Hardware, machining, software or compute built around what you make
    - heading: Partnership levels
      table:
        columns: [Level, Value, What it unlocks, What you get]
        rows:
          - cells:
              - Bronze
              - Under $2,500
              - Your platform as the reference for ROS 2, controls or perception work
              - Recognition on the robot, esra.bot and the repo
          - cells:
              - Silver
              - $2,500–$7,500
              - 'A new ESRA subsystem: a leg module, arm or perception stack'
              - Bronze, plus featured branding, regular content and student access
          - cells:
              - Gold
              - $7,500–$12,500
              - A flagship project, from architecture to tested hardware
              - Silver, plus prominent branding and a co-branded case study
          - cells:
              - Platinum
              - $12,500+
              - A programme across several robots
              - Gold, plus priority recognition, a partnership announcement and year-round coverage
        note: Levels go by the agreed practical value of a contribution, not list price.
    - heading: Where your support is seen
      items:
        - On the robot
        - esra.bot and GitHub
        - Build updates and videos
        - Events and trade-show booths
        - Talks with the students
    - heading: How it starts
      items:
        - Intro call
        - Scope the package and level
        - Confirm in writing
        - Teams build and report back
  notes:
    - label: Good to know
      body: >-
        Recognition is neutral, with no endorsements. Support gives no control
        over projects. ESRA is a 501(c)(3), so donations are tax-deductible.
    - label: Coming soon
      body: >-
        The Industry Research Alliance, where a company brings a research
        question and labs and students take it on together.
  cta: Start a conversation
  subject: Industry partnership
  # TODO(confirm): partnerships@ must exist in Zoho. If it doesn't yet, use info@esra.bot.
  email: partnerships@esra.bot
