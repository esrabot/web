# Partners: the clubs, schools, companies and organizations ESRA works
# with. Each one appears on the home page's partner wall and on /members.
#
#   kind      club (default) | school | company | organization
#             Clubs and schools are listed first. Companies and
#             organizations (sponsors among them) get a group of their own
#             on the home page, which appears as soon as there is one.
#   logo      file name under src/assets/logos: SVG preferred, or a PNG at
#             least 400px wide. Any colors. Every logo is shown in the same
#             gray and fitted to the same size box, so none outshouts
#             another. Until a file is added, the wall shows the partner's
#             initials in a dashed box: a placeholder, not a logo.
#   logoMode  silhouette (default): the logo redrawn in one gray ink.
#             grayscale: the logo itself in gray, for one with detail a
#             single ink would lose (shading, a photo, a crest).
#   logoInvert  true if a silhouette comes out as its own negative.
#
# Only add a partner who has agreed to be listed, with a logo they have
# given permission to use.
#
# Migrated from the old site's content/team/partners.yaml, with the CRT
# URL upgraded to https (it was http) and the Rutgers Dynamics entry
# pointed at the club's real site rather than its LinkedIn page.
#
# TODO(confirm): RMC and UC Berkeley have no logo file yet, so both show
# the initials placeholder. The old site pointed both at ESRA's own mark,
# which misrepresented them. Add their files when the team has them.

- id: crt
  name: Caltech Robotics Team
  abbr: CRT
  school: Caltech
  location: Pasadena, CA
  url: https://crt.caltech.edu/
  logo: crt.png

- id: rmc
  name: Robotic Manipulation Club
  abbr: RMC
  school: Caltech
  location: Pasadena, CA
  url: https://rmc.caltech.edu/

- id: curc
  name: Columbia University Robotics Club
  abbr: CURC
  school: Columbia University
  location: New York, NY
  url: https://www.columbiarobotics.club/
  logo: curc.svg

- id: rutgers-dynamics
  name: Rutgers Dynamics
  school: Rutgers University
  location: New Brunswick, NJ
  url: https://www.rudynamics.org/
  logo: rutgers-dynamics.png

- id: berkeley
  name: UC Berkeley
  kind: school
  school: University of California, Berkeley
  location: Berkeley, CA
  url: https://www.berkeley.edu/
