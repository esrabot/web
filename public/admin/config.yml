# Sveltia CMS — a visual editor over the same git workflow.
#
# Nothing here is a separate database: the CMS commits markdown to this
# repo exactly as a person editing files would. Anything written through
# /admin can be edited by hand afterwards, and vice versa.
#
# TWO WAYS IN.
#
# 1. Locally, with no setup at all: run `pnpm dev`, open
#    http://localhost:4321/admin and choose "Work with local repository".
#    Sveltia reads and writes the files on disk directly through the
#    browser's File System Access API, so there is no login, no token and
#    no server. Chrome or Edge only — Firefox and Safari have not shipped
#    that API. Your edits show up as ordinary uncommitted changes.
#
# 2. Live at esra.bot/admin, where editors sign in with GitHub. That needs
#    an OAuth client, because the browser cannot hold the client secret.
#    `base_url` below points at it. See docs/cms-setup.md for the steps.
#
# Either way this is not a separate database: the CMS commits the same
# markdown a person editing files by hand would produce.

backend:
  name: github
  repo: esrabot/web
  branch: main

  # The OAuth relay that turns a GitHub login into a token. Uncomment and
  # set this to your deployed Worker URL — until then, sign-in is
  # unavailable and only local mode (1 above) works.
  # base_url: https://sveltia-cms-auth.<subdomain>.workers.dev

  # Editors sign in as themselves, so every commit and pull request is
  # attributed to their own GitHub account rather than to a shared bot.
  # This requires write access to esrabot/web — add contributors to the
  # org first. Set to `true` instead to let people without access propose
  # changes from a fork.
  open_authoring: false
  squash_merges: true

# Editorial workflow puts new entries into a draft -> review -> publish
# pipeline backed by pull requests.
publish_mode: editorial_workflow

media_folder: src/assets/uploads
public_folder: ../../assets/uploads

collections:
  - name: members
    label: Members
    label_singular: member
    folder: src/content/members
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    media_folder: ../../assets/avatars
    public_folder: ../../assets/avatars
    fields:
      - { name: name, label: Full name, widget: string }
      - { name: order, label: Sort order, widget: number, default: 100 }
      - {
          name: discipline,
          label: Discipline,
          widget: string,
          required: false,
          hint: 'e.g. Mechanical, Software',
        }
      - {
          name: affiliation,
          label: Affiliation,
          widget: string,
          required: false,
          hint: 'Your club and school, e.g. Rutgers Dynamics',
        }
      - { name: avatar, label: Photo, widget: image, required: false }
      - { name: pronouns, label: Pronouns, widget: string, required: false }
      - name: roles
        label: Roles
        widget: list
        required: false
        fields:
          - { name: org, label: Organisation, widget: select, options: [esra, rutgers-dynamics] }
          - {
              name: title,
              label: Title,
              widget: string,
              required: false,
              hint: 'e.g. Co-director. Leave blank if you hold no officer role.',
            }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - name: platform
            label: Platform
            widget: select
            options: [website, github, linkedin, youtube, instagram, x, bluesky, email, linktree]
          - { name: handle, label: Display text, widget: string, required: false }
          - {
              name: url,
              label: URL,
              widget: string,
              hint: 'Full URL. For email use mailto:you@example.com',
            }
      - { name: inactive, label: Inactive, widget: boolean, default: false }
      - { name: body, label: Bio, widget: markdown }

  # Events, the roadmap, and the "Get involved" cards. Each file is a single
  # top-level list, so its one list field is marked `root: true` and is
  # saved as the file itself rather than under a key.
  - name: events
    label: Events
    files:
      - name: events
        label: Featured events
        file: src/content/events.yaml
        description: 'Big events that get a card on /events. Everyday dates go in the Google Calendar instead.'
        fields:
          - name: events
            label: Events
            label_singular: event
            widget: list
            root: true
            summary: '{{fields.title}} — {{fields.when}}'
            fields:
              - { name: id, label: ID, widget: string, hint: 'Lowercase, hyphenated, unique. Used in links: /events#id' }
              - { name: title, label: Title, widget: string }
              - { name: kicker, label: Small line above the title, widget: string, required: false }
              - { name: featured, label: Featured (large card), widget: boolean, default: false }
              - { name: when, label: 'When, as readers see it', widget: string, hint: 'e.g. November 2026, or Jan 16–18, 2027' }
              - {
                  name: start,
                  label: Start date,
                  widget: datetime,
                  date_format: 'yyyy-MM-dd',
                  time_format: false,
                  hint: 'Decides whether the event shows as upcoming, happening now, or past.',
                }
              - {
                  name: end,
                  label: End date,
                  widget: datetime,
                  date_format: 'yyyy-MM-dd',
                  time_format: false,
                  required: false,
                }
              - { name: location, label: Location, widget: string, required: false }
              - { name: format, label: 'Format (Workshop, Meetup…)', widget: string, required: false }
              - { name: summary, label: Summary, widget: text }
              - { name: highlights, label: Highlights, widget: list, required: false }
              - {
                  name: image,
                  label: Photo path,
                  widget: string,
                  required: false,
                  hint: 'Optional. A path under src/assets, e.g. uploads/workshop.jpg',
                }
              - { name: imageAlt, label: Photo description, widget: string, required: false }
              - name: links
                label: Buttons
                widget: list
                required: false
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string, hint: 'A full URL, or a site path such as /#join' }
              - { name: draft, label: Draft (hidden), widget: boolean, default: false }

  - name: roadmap
    label: Roadmap
    files:
      - name: programs
        label: Robots on the roadmap
        file: src/content/programs.yaml
        description: 'Shown on the home page and at the top of /projects. Only state what is decided.'
        fields:
          - name: programs
            label: Programmes
            label_singular: programme
            widget: list
            root: true
            summary: '{{fields.title}} ({{fields.status}})'
            fields:
              - { name: id, label: ID, widget: string, hint: 'Lowercase, hyphenated, unique. Used in links: /projects#id' }
              - { name: order, label: Sort order, widget: number, default: 100 }
              - { name: title, label: Title, widget: string }
              - { name: designation, label: 'Designation (e.g. H1)', widget: string, required: false }
              - { name: kind, label: 'Kind (Humanoid, Quadruped…)', widget: string }
              - { name: level, label: 'Level (Flagship, Beginner…)', widget: string, required: false }
              - { name: status, label: Status, widget: select, options: [active, planned, complete], default: planned }
              - { name: flagship, label: Flagship (wide card and schedule), widget: boolean, default: false }
              - { name: timeframe, label: Timeframe, widget: string, required: false }
              - { name: summary, label: One-line summary, widget: string }
              - { name: description, label: Description, widget: text, required: false }
              - { name: focus, label: Subsystems or focus areas, widget: list, required: false }
              - { name: outputs, label: What it publishes, widget: list, required: false }
              - name: milestones
                label: Milestones
                widget: list
                required: false
                summary: '{{fields.when}} — {{fields.title}}'
                fields:
                  - {
                      name: starts,
                      label: Starts,
                      widget: datetime,
                      date_format: 'yyyy-MM-dd',
                      time_format: false,
                      hint: 'Only places the "now" marker. Readers see the line below.',
                    }
                  - { name: when, label: 'When, as readers see it', widget: string }
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: One sentence, widget: string }

  - name: pathways
    label: Get involved
    files:
      - name: pathways
        label: Ways to get involved
        file: src/content/pathways.yaml
        description: 'The cards in "Get involved" on the home page, and the pop-up each one opens.'
        fields:
          - name: pathways
            label: Ways in
            label_singular: way in
            widget: list
            root: true
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: ID, widget: string, hint: 'Lowercase, hyphenated, unique.' }
              - { name: order, label: Sort order, widget: number, default: 100 }
              - { name: icon, label: Icon, widget: select, options: [team, affiliate, industry] }
              - { name: audience, label: 'Who it is for (two or three words)', widget: string }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: One-line pitch, widget: string }
              - { name: points, label: Three lines on the card, widget: list }
              - { name: intro, label: Pop-up opening paragraph, widget: text }
              - name: sections
                label: Pop-up sections
                widget: list
                summary: '{{fields.heading}}'
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: items, label: Items, widget: list }
              - name: note
                label: Highlighted note
                widget: object
                required: false
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: body, label: Text, widget: text }
              - { name: start, label: How to start, widget: text }
              - { name: cta, label: Button label, widget: string }
              - { name: subject, label: Email subject line, widget: string }
